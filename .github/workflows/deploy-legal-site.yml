name: Deploy legal site to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'legal-site/**'
      - '.github/workflows/deploy-legal-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: legal-site/package-lock.json

      - name: Install legal site dependencies
        working-directory: legal-site
        run: npm ci

      - name: Build static site
        working-directory: legal-site
        env:
          NEXT_PUBLIC_SITE_BASE_PATH: /dugun-planim
          NEXT_PUBLIC_SITE_URL: https://barkinkilicaslan.github.io/dugun-planim
          NEXT_PUBLIC_SUPPORT_EMAIL: appsupportline@gmail.com
          NEXT_PUBLIC_PUBLISHER_NAME: Barkın Kılıçaslan
        run: npm run build

      - name: Add GitHub Pages marker
        run: touch legal-site/dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: legal-site/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
